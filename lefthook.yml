pre-commit:
  commands:
    check_migrations:
      glob: "src-tauri/migrations/*.sql"
      run: node scripts/check_migrations.js {staged_files}
      stage_fixed: true

pre-push:
  commands:
    lint:
      run: NODE_OPTIONS="--max-old-space-size=8192" npm run lint
    check:
      run: npm run check
